workflows:
  android-debug:
    name: AnimeVault Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Android platform
        script: flutter create --platforms=android --project-name animevault .
      - name: Build debug APK
        script: flutter build apk --debug
      - name: Verify APK
        script: |
          set -e
          test -f build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/AnimeVault-debug.apk
    artifacts:
      - artifacts/AnimeVault-debug.apk
